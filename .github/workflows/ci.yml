name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: contrast.js — passing pairs exit 0
        run: |
          node .claude/skills/design-from-references/scripts/contrast.js "#fff:#000" "#6b78ff:#0b0b0b"
          node .claude/skills/design-from-references/scripts/contrast.js "#ffffff" "#0b0b0b"

      - name: contrast.js — failing pair exits 1
        run: |
          if node .claude/skills/design-from-references/scripts/contrast.js "#777:#999"; then
            echo "expected exit 1 for a failing pair" && exit 1
          fi

      - name: contrast.js — invalid input exits 2
        run: |
          node .claude/skills/design-from-references/scripts/contrast.js "nope:#000" || code=$?
          if [ "${code:-0}" -ne 2 ]; then
            echo "expected exit 2 for invalid input, got ${code:-0}" && exit 1
          fi

      - name: contrast.js — known ratios
        run: |
          node -e '
            const { parseHex, ratio } = require("./.claude/skills/design-from-references/scripts/contrast.js");
            const check = (fg, bg, expected) => {
              const r = ratio(parseHex(fg), parseHex(bg));
              if (Math.abs(r - expected) > 0.01) { console.error(`${fg}/${bg}: got ${r}, expected ${expected}`); process.exit(1); }
            };
            check("#ffffff", "#000000", 21);
            check("#fff", "#000", 21);      // 3-digit expansion
            check("#777777", "#777777", 1);
            console.log("ratios ok");
          '

      - name: nameCheck.js — rejects the tells, keeps real spelling
        run: |
          # the exact name that shipped, and the copy that shipped with it
          for bad in "Ledger — accessible form validation kit"                      "Otava - wellness landing page"                      "design-from-references-kit"                      "Unlock seamless onboarding"; do
            if node .claude/skills/design-from-references/scripts/nameCheck.js "$bad" > /dev/null; then
              echo "nameCheck accepted a name it must reject: $bad" && exit 1
            fi
          done
          # ordinary spelling hyphens must survive: banning them produced
          # "e bike" and "real world range" on a shipped project once
          for good in "Ledger, an accessible form validation kit"                       "Fettle e-bike servicing, a 10-year guarantee"                       "real-world range on a mid-drive all-rounder"                       "Kvitto, a pricing table that shows the first year total"; do
            node .claude/skills/design-from-references/scripts/nameCheck.js "$good" > /dev/null || {
              echo "nameCheck rejected a legitimate name: $good" && exit 1; }
          done
          node .claude/skills/design-from-references/scripts/nameCheck.js || code=$?
          if [ "${code:-0}" -ne 2 ]; then echo "expected exit 2 with no arguments, got ${code:-0}" && exit 1; fi

      - name: datasetTally.js — runs on every bundled dataset
        run: |
          found=0
          for d in test/fixtures/datasets/*/; do
            c=$(basename "$d")
            [ -f "$d/dataset.json" ] || continue
            found=1
            node .claude/skills/design-from-references/scripts/datasetTally.js "$c"               --dataset-root test/fixtures/datasets --out "$RUNNER_TEMP/$c.md" > /dev/null
            test -s "$RUNNER_TEMP/$c.md" || { echo "no constraints file written for $c" && exit 1; }
            grep -q "Deviations" "$RUNNER_TEMP/$c.md" || { echo "constraints file for $c lacks the Deviations table" && exit 1; }
          done
          [ "$found" = 1 ] || { echo "no fixture dataset found: these assertions were passing vacuously" && exit 1; }

      - name: datasetTally.js — bad input exits 2
        run: |
          node .claude/skills/design-from-references/scripts/datasetTally.js noSuchCategory || code=$?
          if [ "${code:-0}" -ne 2 ]; then echo "expected exit 2 for unknown category, got ${code:-0}" && exit 1; fi
          unset code
          node .claude/skills/design-from-references/scripts/datasetTally.js || code=$?
          if [ "${code:-0}" -ne 2 ]; then echo "expected exit 2 with no arguments, got ${code:-0}" && exit 1; fi

      - name: datasetTally.js — verdicts match the data
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const out = execFileSync("node", [
              ".claude/skills/design-from-references/scripts/datasetTally.js",
              "longevityClinic", "--dataset-root", "test/fixtures/datasets",
              "--out", process.env.RUNNER_TEMP + "/lc.md",
            ], { encoding: "utf8" });
            // 9 of the 10 sites sit on a light background: the verdict that a
            // rejected design got wrong by hand.
            if (!/light 9 \| dark 1/.test(out)) { console.error("background tally changed"); process.exit(1); }
            if (!/-> LIGHT/.test(out)) { console.error("expected a LIGHT verdict"); process.exit(1); }
            // Fonts measured in the dataset must still be flagged as slop.
            if (!/SLOP-FLAGGED/.test(out)) { console.error("slop flagging is not firing"); process.exit(1); }
            console.log("tally verdicts ok");
          '

      - name: designNotesScan.js — runs and never invents a value
        run: |
          found=0
          for d in test/fixtures/datasets/*/; do
            c=$(basename "$d")
            [ -f "$d/dataset.json" ] || continue
            found=1
            node .claude/skills/design-from-references/scripts/designNotesScan.js "$c"               --dataset-root test/fixtures/datasets > /dev/null
          done
          [ "$found" = 1 ] || { echo "no fixture dataset found" && exit 1; }
          node .claude/skills/design-from-references/scripts/designNotesScan.js noSuchCategory || code=$?
          if [ "${code:-0}" -ne 2 ]; then echo "expected exit 2 for unknown category, got ${code:-0}" && exit 1; fi

      - name: designNotesScan.js — headline sizes are read, not assumed
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const out = execFileSync("node", [
              ".claude/skills/design-from-references/scripts/designNotesScan.js",
              "longevityClinic", "--dataset-root", "test/fixtures/datasets", "--json",
            ], { encoding: "utf8" });
            const scan = JSON.parse(out);
            const h = scan.dimensions.find((d) => d.key === "HEADLINE SIZE");
            // The measurement that disproved the hand-written ">56px is slop" rule.
            if (h.counts[">56px"] !== 7) { console.error("expected 7 sites above 56px, got " + JSON.stringify(h.counts)); process.exit(1); }
            // Silence must stay silence: unknown is a valid answer, never a guess.
            const align = scan.dimensions.find((d) => d.key === "TEXT ALIGNMENT");
            if (align.unknown !== 10) { console.error("alignment should be unknown for all 10 notes, got " + align.unknown); process.exit(1); }
            console.log("scan counts ok");
          '

      - name: designNotesScan.js — geometry rows never invent a value
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const out = execFileSync("node", [
              ".claude/skills/design-from-references/scripts/designNotesScan.js",
              "longevityClinic", "--dataset-root", "test/fixtures/datasets", "--json",
            ], { encoding: "utf8" });
            const scan = JSON.parse(out);
            const get = (k) => {
              const d = scan.dimensions.find((x) => x.key === k);
              if (!d) { console.error("missing geometry dimension: " + k); process.exit(1); }
              return d;
            };
            // The geometry rows exist. design.md rarely records radius or
            // elevation, so on this fixture they are almost all unknown --
            // which is the correct answer, and the one worth protecting: a
            // future loosening of these regexes would start inventing values.
            const radius = get("CORNER RADIUS");
            if (radius.unknown !== 10) { console.error("CORNER RADIUS should be unknown for all 10 notes, got " + radius.unknown); process.exit(1); }
            const uniform = get("RADIUS UNIFORMITY");
            if (uniform.unknown !== 10) { console.error("RADIUS UNIFORMITY should be unknown for all 10, got " + uniform.unknown); process.exit(1); }
            // SURFACE TREATMENT matches one real elevation claim here. It must
            // stay at one: "flat bullet list" is not a flat surface, and the
            // loose word-boundary flat pattern that counted it turned 2 into 7 in
            // saasPricing before the pattern was tightened.
            const surface = get("SURFACE TREATMENT");
            if (surface.known !== 1) { console.error("SURFACE TREATMENT should have exactly 1 stated, got " + surface.known + " " + JSON.stringify(surface.counts)); process.exit(1); }
            console.log("geometry rows ok");
          '

      - name: every site has the design.md the scan reads
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            let missing = 0;
            const root = "test/fixtures/datasets";
            const cats = fs.readdirSync(root, { withFileTypes: true }).filter(d => d.isDirectory());
            if (!cats.length) { console.error("no fixture datasets: this check was vacuous"); process.exit(1); }
            for (const c of cats) {
              const dir = path.join(root, c.name);
              const ds = JSON.parse(fs.readFileSync(path.join(dir, "dataset.json"), "utf8"));
              for (const s of ds.sites || []) {
                const rel = s.design || `${s.slug}/design.md`;
                if (!fs.existsSync(path.join(dir, rel))) { console.error("missing " + c.name + "/" + rel); missing++; }
              }
            }
            if (missing) process.exit(1);
            console.log("design.md coverage ok");
          '

      - name: plugin + dataset JSON are well-formed
        run: |
          node -e '
            const fs = require("fs");
            const files = [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json",
                           ...fs.readdirSync("test/fixtures/datasets", { withFileTypes: true })
                               .filter(d => d.isDirectory())
                               .map(d => `test/fixtures/datasets/${d.name}/dataset.json`)];
            for (const f of files) { JSON.parse(fs.readFileSync(f, "utf8")); console.log("ok", f); }
          '
