name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The assertions live in test/run.js, not here, so they are runnable
      # locally with the same command CI uses. They were inline bash heredocs
      # once; a YAML edit broke the quoting and nobody noticed for weeks.
      - name: npm test
        run: npm test
